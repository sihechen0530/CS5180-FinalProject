# Academy empty goal — training and paths

env_id: academy_empty_goal_close
scenario: empty

# Run identifier (output directory is specified via --output-dir on the CLI)
run_name: llm_reward_ppo_empty_goal
checkpoint_prefix: llm_reward_ppo_empty_goal
baseline_zip: llm_reward_ppo_empty_goal.zip

total_timesteps: 100000
num_cpu: 1
checkpoint_freq: 50000

learning_rate: 0.0003
ent_coef: 0.01

reward_wrapper:
  use_custom: false
  # Signature: llm_reward_formula(env_reward, features, prev_features) -> float
  # prev_features is never None (on first step, equals features so delta=0)
  use_llm_reward: true
  llm_reward_formula: |
    def llm_reward_formula(env_reward, features, prev_features):
        # Empty goal scenario: reward ball moving toward goal (delta-based)
        delta_dist = prev_features["ball_dist_to_goal"] - features["ball_dist_to_goal"]
        return float(env_reward) + 0.5 * delta_dist

coach_interval: 50
use_action_masking: false
