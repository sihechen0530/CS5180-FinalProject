# Academy 3v1 with keeper — training and paths

env_id: academy_3_vs_1_with_keeper
scenario: 3v1

# Run identifier (output directory is specified via --output-dir on the CLI)
run_name: llm_reward_ppo_3v1
checkpoint_prefix: llm_reward_ppo_3v1
baseline_zip: llm_reward_ppo_3v1.zip

# Training
total_timesteps: 10000000
num_cpu: 16
checkpoint_freq: 500000  # save every N steps (total across envs)

# PPO hyperparameters (optional overrides)
learning_rate: 0.0003
ent_coef: 0.01
# n_steps: 2048
# batch_size: 64
# gamma: 0.99

# Wrappers: set to null to use sparse env reward only
reward_wrapper:
  use_custom: false
  # When use_custom: true, dense formula weights (see core/wrappers.py)
  # ball_dist_weight: 0.5
  # teammate_proximity_weight: 0.2
  # goal_bonus: 1.0

  # LLM Reward Injection
  # Signature: llm_reward_formula(env_reward, features, prev_features) -> float
  # prev_features is never None (on first step, equals features so delta=0)
  use_llm_reward: true
  llm_reward_formula: |
    def llm_reward_formula(env_reward, features, prev_features):
        # Dense reward: encourage ball moving toward goal (delta-based shaping)
        delta_dist = prev_features["ball_dist_to_goal"] - features["ball_dist_to_goal"]
        return float(env_reward) + 0.5 * delta_dist

# Coach / action masking (Direction B): call every N steps
coach_interval: 50
use_action_masking: false


